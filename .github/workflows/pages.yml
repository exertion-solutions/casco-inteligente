name: Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - name: Estampar la version del commit (?v= y CACHE_VERSION)
        run: |
          set -e
          V="$(git rev-parse HEAD:web | cut -c1-10)"
          sed -i -E "s/\?v=[0-9]+/?v=$V/g" web/index.html web/comandos.html
          sed -i -E "s/'vigia-[0-9a-z-]+'/'vigia-$V'/" web/sw.js
          grep -n "CACHE_VERSION = 'vigia-$V'" web/sw.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
