# coturn 4.18.x - TURN/STUN del Vigía · Casco Inteligente (voz en vivo). SIN secretos: el
# docker-compose agrega al arrancar, desde .env: static-auth-secret, external-ip y
# denied-peer-ip (IP publica propia). Ver README seccion "Voz en vivo (TURN)".
# Opciones verificadas contra examples/etc/turnserver.conf (master) y notas 4.18.0:
# "no-cli" y "no-dtls" fueron ELIMINADAS en 4.18.0 (no usarlas: el servidor no arrancaria).

# --- Puertos ---
# UDP y TCP
listening-port=3478
# rango de relay (UDP): abrir en firewall
min-port=49160
max-port=49200

# --- Autenticacion: credenciales temporales (TURN REST API) ---
# habilita lt-cred-mech internamente; NO combinar con lt-cred-mech
use-auth-secret
realm=casco
stale-nonce=600

# --- Sin TLS en esta etapa (sin certificados). 5349 no se abre. ---
no-tls
# sin relays TCP (RFC 6062): WebRTC solo usa UDP relay
no-tcp-relay
fingerprint
# no revelar la version
no-software-attribute
# CLI: apagado por defecto en 4.18 (no hay "no-cli"); no se publica.

# --- Que puede alcanzar el relay: nada de la red interna del VPS ni de los contenedores ---
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# (la IP publica del propio VPS se agrega desde .env al arrancar)

# --- Cuotas: 1 casco + pocos supervisores ---
# allocations simultaneas por usuario
user-quota=4
# allocations totales
total-quota=20
# bytes/s por sesion (~512 kbps; Opus necesita ~10 kB/s)
max-bps=64000
# bytes/s totales (~4 Mbps)
bps-capacity=500000

# --- Logs a stdout (docker compose logs coturn) ---
log-file=stdout
simple-log
