<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casco Inteligente</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#14202b; --mute:#5b6b7a; --line:#d9e0e6; --acc:#0b6bcb; --sos:#c62828; --sosbg:#c62828; --onacc:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0e1419; --card:#16202a; --ink:#e8eef3; --mute:#93a3b3; --line:#27333f; --acc:#5aa9ff; --sos:#ff5252; --sosbg:#c62828; --onacc:#0e1419; }
  }
  :root[data-theme="dark"] { --bg:#0e1419; --card:#16202a; --ink:#e8eef3; --mute:#93a3b3; --line:#27333f; --acc:#5aa9ff; --sos:#ff5252; --sosbg:#c62828; --onacc:#0e1419; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:18px; margin:0; }
  main { max-width:880px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  form.login { max-width:360px; margin:48px auto; display:grid; gap:12px; }
  label { display:grid; gap:4px; font-size:14px; color:var(--mute); }
  input { padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--acc); color:var(--onacc); font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .err { color:var(--sos); min-height:1.2em; font-size:14px; }
  #sos { display:none; background:var(--sosbg); color:#fff; padding:14px 16px; border-radius:10px; margin-bottom:12px; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  li.ev { display:grid; gap:8px; overflow-wrap:anywhere; }
  .row { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
  .tag.sos, .tag.fall { background:var(--sosbg); color:#fff; border-color:var(--sosbg); }
  .mute { color:var(--mute); font-size:14px; }
  img.media, video.media { width:100%; max-height:420px; object-fit:contain; background:#000; border-radius:8px; }
  a.btn { display:inline-block; padding:10px 14px; border-radius:8px; background:transparent; color:var(--ink); border:1px solid var(--line); text-decoration:none; font:inherit; }
  a.btn:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  li.pending { border-color:var(--sosbg); border-width:2px; }
  .tag.ok { background:transparent; color:var(--ink); }
  button.attend { background:var(--sosbg); color:#fff; font-weight:600; }
  button[disabled] { opacity:.6; cursor:wait; }
  .hidden { display:none !important; }
  #lives { display:grid; gap:12px; margin-bottom:12px; }
  .live { display:grid; gap:8px; }
  .live h2 { font-size:16px; margin:0; overflow-wrap:anywhere; }
  .live video { width:100%; max-height:420px; object-fit:contain; background:#000; border-radius:8px; }
  .live .state { font-weight:600; }
  .live .state.bad { color:var(--sos); }
</style>
</head>
<body>
<header>
  <h1>Casco Inteligente</h1>
  <div class="row">
    <span id="who" class="mute"></span>
    <button id="logout" class="ghost hidden">Salir</button>
  </div>
</header>
<main>
  <form id="login" class="card login">
    <label>Correo <input id="email" type="email" autocomplete="username" required></label>
    <label>Contraseña <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Ingresar</button>
    <div id="loginErr" class="err" role="alert"></div>
  </form>

  <section id="app" class="hidden">
    <div id="sos" role="alert"></div>
    <div class="row" style="margin-bottom:12px">
      <button id="enableSound" class="ghost">Activar sonido de alerta</button>
      <a class="btn" href="https://caps.runde.pro/index/spyl" target="_blank" rel="noopener noreferrer">Cámara en vivo</a>
      <span id="status" class="mute">Conectando…</span>
    </div>
    <div id="lives" class="hidden"></div>
    <ul id="feed"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cfg = window.CASCO_CONFIG || {};
  const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  let audioCtx = null, channel = null;
  const TZ = 'America/Argentina/Buenos_Aires';
  const fmt = iso => new Date(iso).toLocaleString('es-AR', { timeZone: TZ, dateStyle: 'short', timeStyle: 'medium' });

  function beep() {
    if (!audioCtx) return;
    for (let i = 0; i < 3; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + i * 0.35); o.stop(audioCtx.currentTime + i * 0.35 + 0.2);
    }
  }

  async function mediaEl(path, type) {
    const { data, error } = await sb.storage.from('casco-media').createSignedUrl(path, 600);
    if (error || !data) return null;
    const el = document.createElement(type === 'video' ? 'video' : 'img');
    el.className = 'media'; el.src = data.signedUrl;
    if (type === 'video') el.controls = true;
    return el;
  }

  const cards = new Map();    // event_id -> <li>
  const pending = new Map();  // event_id -> ev (SOS/caida sin atender)
  const acks = new Map();     // event_id -> ack
  let me = null;

  // ---- Video en vivo propio (WHEP contra MediaMTX en LIVE_HOST; ver docs/PROTOCOLO-VIDEO.md) ----
  const LIVE_HOST = String(cfg.LIVE_HOST || '').trim();
  const DEV_RE = /^[A-Za-z0-9_-]{1,64}$/;
  const STUN = [{ urls: 'stun:stun.l.google.com:19302' }];
  const RETRY_WINDOW_MS = 40000;   // el casco tarda hasta ~30 s en arrancar
  const lives = new Map();         // device_id -> panel
  const devOf = new Map();         // event_id -> device_id
  let token = null;
  sb.auth.onAuthStateChange((_e, s) => { token = s ? s.access_token : null; });
  async function getToken() {
    const { data } = await sb.auth.getSession();
    if (data && data.session) token = data.session.access_token;
    return token;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

  function gathered(pc, ms) {
    return new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const done = () => { pc.removeEventListener('icegatheringstatechange', on); clearTimeout(t); res(); };
      const on = () => { if (pc.iceGatheringState === 'complete') done(); };
      const t = setTimeout(done, ms);
      pc.addEventListener('icegatheringstatechange', on);
    });
  }

  function ensureLive(id) {
    if (!LIVE_HOST || !DEV_RE.test(id)) return null;
    if (lives.has(id)) return lives.get(id);
    const sec = mk('section', 'card live');
    sec.setAttribute('aria-label', 'Video en vivo del casco ' + id);
    sec.append(mk('h2', '', 'Video en vivo · Casco ' + id));
    const row = mk('div', 'row');
    const bStart = mk('button', '', 'Iniciar'); bStart.type = 'button';
    const bStop = mk('button', 'ghost', 'Detener'); bStop.type = 'button'; bStop.disabled = true;
    const state = mk('span', 'state', 'Detenido'); state.setAttribute('role', 'status'); state.setAttribute('aria-live', 'polite');
    const stats = mk('span', 'mute');
    row.append(bStart, bStop, state, stats);
    const video = mk('video'); video.autoplay = true; video.muted = true; video.playsInline = true;
    video.setAttribute('aria-label', 'Video en vivo del casco ' + id); video.classList.add('hidden');
    sec.append(row, video);
    $('lives').append(sec); $('lives').classList.remove('hidden');

    const L = { id, sec, bStart, bStop, gen: 0, pc: null, loc: null, statsTimer: null };
    const setState = (t, bad) => { state.textContent = t; state.classList.toggle('bad', !!bad); };
    const base = 'https://' + LIVE_HOST + '/live/' + encodeURIComponent(id) + '/whep';

    function closePc() {
      clearInterval(L.statsTimer); L.statsTimer = null; stats.textContent = '';
      if (L.pc) { L.pc.onconnectionstatechange = null; L.pc.ontrack = null; try { L.pc.close(); } catch (_) {} L.pc = null; }
    }
    async function deleteSession() {   // WHEP: DELETE sobre el Location devuelto
      const loc = L.loc; L.loc = null; if (!loc) return;
      try { await fetch(loc, { method: 'DELETE', headers: { Authorization: 'Bearer ' + await getToken() }, keepalive: true }); } catch (_) {}
    }
    function fail(msg) { closePc(); setState('Error: ' + msg, true); bStart.disabled = false; bStop.disabled = true; }

    async function whepOnce(gen) {
      const tok = await getToken();
      if (!tok) throw Object.assign(new Error('sin sesión'), { fatal: true });
      const pc = new RTCPeerConnection({ iceServers: STUN });
      L.pc = pc;
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.ontrack = e => { video.srcObject = (e.streams && e.streams[0]) || new MediaStream([e.track]); video.classList.remove('hidden'); };
      await pc.setLocalDescription(await pc.createOffer());
      await gathered(pc, 2000);
      if (gen !== L.gen) throw Object.assign(new Error('cancelado'), { fatal: true });
      let res;
      try {
        res = await fetch(base, { method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
      } catch (e) { throw new Error('sin conexión con el servidor'); }
      if (res.status === 401 || res.status === 403) throw Object.assign(new Error('no autorizado (' + res.status + ')'), { fatal: true });
      if (res.status !== 201 && !res.ok) throw new Error('el servidor respondió ' + res.status);
      const loc = res.headers.get('Location');
      if (loc) L.loc = new URL(loc, base).href;
      await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
      await new Promise((ok, ko) => {
        const t = setTimeout(() => ko(new Error('sin medios (ICE)')), 10000);
        const chk = () => {
          if (pc.connectionState === 'connected') { clearTimeout(t); ok(); }
          else if (pc.connectionState === 'failed' || pc.connectionState === 'closed') { clearTimeout(t); ko(new Error('conexión fallida')); }
        };
        pc.onconnectionstatechange = chk; chk();
      });
    }

    function watch(gen) {
      L.pc.onconnectionstatechange = () => {
        const s = L.pc && L.pc.connectionState;
        if ((s === 'failed' || s === 'closed') && gen === L.gen) { setState('Reconectando…'); closePc(); deleteSession().then(() => run(gen)); }
      };
      L.statsTimer = setInterval(async () => {
        if (!L.pc || !L.pc.getStats) return;
        try {
          const rep = await L.pc.getStats(); const out = [];
          rep.forEach(r => {
            if (r.type === 'inbound-rtp' && r.kind === 'video' && r.frameWidth) out.push(r.frameWidth + '×' + r.frameHeight + (r.framesPerSecond ? ' · ' + Math.round(r.framesPerSecond) + ' fps' : ''));
            if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated && r.currentRoundTripTime != null) out.push('RTT ' + Math.round(r.currentRoundTripTime * 1000) + ' ms');
          });
          if (gen === L.gen) stats.textContent = out.join(' · ');
        } catch (_) {}
      }, 2000);
    }

    async function run(gen) {
      const deadline = Date.now() + RETRY_WINDOW_MS; let n = 0, last = '';
      while (gen === L.gen) {
        setState('Esperando al casco…');
        try { await whepOnce(gen); if (gen !== L.gen) return; setState('En vivo'); watch(gen); return; }
        catch (e) {
          closePc();
          if (gen !== L.gen) return;
          if (e.fatal) { fail(e.message); return; }
          last = e.message;
        }
        if (Date.now() > deadline) { fail('el casco no respondió (' + last + ')'); return; }
        await sleep(Math.min(1000 * ++n, 5000));
      }
    }

    L.start = async () => {
      const gen = ++L.gen;
      bStart.disabled = true; bStop.disabled = false;
      setState('Solicitando…');
      const { error } = await sb.from('stream_commands').insert({ device_id: id, action: 'start' });
      if (gen !== L.gen) return;
      if (error) { fail('no se pudo solicitar: ' + error.message); return; }
      run(gen);
    };
    L.stop = async () => {
      L.gen++;
      bStart.disabled = false; bStop.disabled = true;
      closePc(); video.srcObject = null; video.classList.add('hidden');
      setState('Deteniendo…');
      await deleteSession();
      const { error } = await sb.from('stream_commands').insert({ device_id: id, action: 'stop' });
      if (error) setState('Error: no se pudo enviar stop: ' + error.message, true); else setState('Detenido');
    };
    bStart.addEventListener('click', L.start);
    bStop.addEventListener('click', L.stop);
    lives.set(id, L);
    return L;
  }

  const needsAttention = ev => ev.type === 'sos' || ev.type === 'fall';

  function refreshBanner() {
    const b = $('sos');
    if (!pending.size) { b.style.display = 'none'; return; }
    const last = [...pending.values()].sort((a, c) => c.created_at.localeCompare(a.created_at))[0];
    b.textContent = pending.size + ' alerta(s) sin atender — última: ' +
      (last.type === 'fall' ? 'CAÍDA' : 'SOS') + ' · Casco ' + last.device_id + ' · ' + fmt(last.created_at);
    b.style.display = 'block';
  }

  function renderAction(ev) {
    const li = cards.get(ev.id); if (!li) return;
    li.querySelector('.action')?.remove();
    const box = document.createElement('div'); box.className = 'row action';
    // Video en vivo: lo sirve la plataforma Runde (el casco solo transmite alli). Abre su Centro de video.
    const live = document.createElement('a');
    live.className = 'btn'; live.textContent = 'Cámara en vivo';
    live.href = 'https://caps.runde.pro/index/spyl'; live.target = '_blank'; live.rel = 'noopener noreferrer';
    box.append(live);
    const devId = devOf.get(ev.id);
    if (LIVE_HOST && DEV_RE.test(devId || '')) {
      const see = document.createElement('button'); see.type = 'button'; see.className = 'ghost';
      see.textContent = 'Ver en vivo'; see.setAttribute('aria-label', 'Ver en vivo el casco ' + devId);
      see.addEventListener('click', () => {
        const L = ensureLive(devId); if (!L) return;
        L.sec.scrollIntoView({ block: 'nearest' });
        if (!L.bStart.disabled) L.start();
        L.bStop.focus();
      });
      box.append(see);
    }
    const ack = acks.get(ev.id);
    if (ack) {
      li.classList.remove('pending');
      const t = document.createElement('span'); t.className = 'tag ok'; t.textContent = 'ATENDIDO';
      const w = document.createElement('span'); w.className = 'mute';
      w.textContent = 'por ' + ack.acked_by_email + ' · ' + fmt(ack.acked_at) + (ack.note ? ' · ' + ack.note : '');
      box.append(t, w);
    } else {
      li.classList.add('pending');
      const note = document.createElement('input');
      note.type = 'text'; note.maxLength = 500; note.placeholder = 'Nota (opcional)';
      note.setAttribute('aria-label', 'Nota de atención'); note.style.flex = '1 1 200px';
      const btn = document.createElement('button'); btn.className = 'attend'; btn.type = 'button';
      btn.textContent = 'Atender';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const row = { event_id: ev.id };
        if (note.value.trim()) row.note = note.value.trim();
        const { error } = await sb.from('event_acks').insert(row);
        if (error && error.code !== '23505') { btn.disabled = false; $('status').textContent = 'No se pudo atender: ' + error.message; return; }
        const { data } = await sb.from('event_acks').select('*').eq('event_id', ev.id).maybeSingle();
        if (data) applyAck(data);
      });
      box.append(note, btn);
    }
    li.append(box);
  }

  function applyAck(ack) {
    acks.set(ack.event_id, ack);
    pending.delete(ack.event_id);
    const li = cards.get(ack.event_id);
    if (li) renderAction({ id: ack.event_id });
    refreshBanner();
  }

  async function render(ev, prepend) {
    const li = document.createElement('li');
    li.className = 'card ev';
    cards.set(ev.id, li);
    devOf.set(ev.id, ev.device_id);
    ensureLive(ev.device_id);
    const row = document.createElement('div'); row.className = 'row';
    const tag = document.createElement('span'); tag.className = 'tag ' + ev.type; tag.textContent = ev.type.toUpperCase();
    const dev = document.createElement('strong'); dev.textContent = 'Casco ' + ev.device_id;
    const when = document.createElement('span'); when.className = 'mute'; when.textContent = fmt(ev.created_at);
    row.append(tag, dev, when);
    li.append(row);
    const bits = [];
    if (ev.press_ms != null) bits.push('pulsación ' + ev.press_ms + ' ms');
    if (ev.battery != null) bits.push('batería ' + ev.battery + '%');
    if (ev.lat != null && ev.lng != null) bits.push(Number(ev.lat).toFixed(5) + ', ' + Number(ev.lng).toFixed(5));
    if (bits.length) { const m = document.createElement('div'); m.className = 'mute'; m.textContent = bits.join(' · '); li.append(m); }
    const feed = $('feed');
    prepend ? feed.prepend(li) : feed.append(li);
    if (needsAttention(ev)) {
      if (!acks.has(ev.id)) pending.set(ev.id, ev);
      renderAction(ev);
      refreshBanner();
    }
    if (ev.media_path) { const el = await mediaEl(ev.media_path, ev.type); if (el) li.insertBefore(el, li.querySelector('.action')); }
  }

  function alertSos(ev) {
    beep();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  }

  async function start(session) {
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    $('who').textContent = session.user.email;
    $('feed').replaceChildren();

    const { data, error } = await sb.from('events').select('*')
      .neq('type', 'heartbeat').order('created_at', { ascending: false }).limit(50);
    if (error) { $('status').textContent = 'Sin permiso o error: ' + error.message; return; }
    me = session.user;
    cards.clear(); pending.clear(); acks.clear();
    const ids = data.filter(needsAttention).map(e => e.id);
    if (ids.length) {
      const r = await sb.from('event_acks').select('*').in('event_id', ids);
      if (!r.error) for (const a of r.data) acks.set(a.event_id, a);
    }
    for (const ev of data) await render(ev, false);
    if (!data.length) { const li = document.createElement('li'); li.className = 'mute'; li.textContent = 'Sin eventos todavía.'; $('feed').append(li); }

    if (channel) sb.removeChannel(channel);
    channel = sb.channel('events-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, p => {
        const ev = p.new;
        if (ev.type === 'heartbeat') return;
        if (needsAttention(ev)) alertSos(ev);
        render(ev, true);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'event_acks' }, p => applyAck(p.new))
      .subscribe(s => { $('status').textContent = s === 'SUBSCRIBED' ? 'En vivo' : s; });
  }

  $('login').addEventListener('submit', async e => {
    e.preventDefault();
    $('loginErr').textContent = '';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) { $('loginErr').textContent = 'No se pudo ingresar: ' + error.message; return; }
    start(data.session);
  });
  $('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
  $('enableSound').addEventListener('click', () => {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    beep();
  });

  sb.auth.getSession().then(({ data }) => { if (data.session) start(data.session); });
})();
</script>
</body>
</html>
